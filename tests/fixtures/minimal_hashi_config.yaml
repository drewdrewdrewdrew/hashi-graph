# Frozen minimal config for unit tests — not tied to training iterations.
data:
  limit: 42
  root_dir: "mock_dataset/"
model:
  type: transformer
  node_embedding_dim: 16
  hidden_channels: 32
  use_noise_head: false
training:
  mode: diff-cont
  batch_size: 7
  learning_rate: 0.0001
  loss_weights:
    ce: 1.0
    degree: 0.1
  early_stopping:
    monitor: val_loss
