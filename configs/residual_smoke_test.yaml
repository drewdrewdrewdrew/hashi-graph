# Minimal smoke test config for residual mode
# Tests that residual training can run 2 epochs and produce decreasing residual_mse

data:
  root_dir: "dataset/"
  size: [8]  # Only 8x8 puzzles
  difficulty: [0]  # Easy only
  train_limit: 10  # Tiny dataset
  val_limit: 3
  val_sampler_seed: 42

model:
  type: "transformer"
  node_embedding_dim: 32
  hidden_channels: 64
  num_layers: 2
  heads: 4
  dropout: 0.1

  capacity_embedding_dim: 8
  degree_embedding_dim: 4
  conflict_embedding_dim: 4
  unused_embedding_dim: 16
  closeness_embedding_dim: 8
  ap_embedding_dim: 4
  spectral_embedding_dim: 16
  constraint_vocab_dim: 24

  edge_type_embedding_dim: 4
  distance_embedding_dim: 8
  logit_embedding_dim: 8

  edge_mlp_width_mult: 1.0
  edge_mlp_depth_mult: 1
  node_encoder_width_mult: 1.0
  node_encoder_depth_mult: 1
  noise_mlp_width_mult: 1
  noise_mlp_depth_mult: 1

  use_global_meta_node: true
  use_row_col_meta: true
  use_meta_mesh: false
  use_meta_row_col_edges: false
  use_component_meta: false
  edge_concat_global_meta: true
  use_edge_features_in_prediction: true

  use_distance: true
  use_conflict_edges: true
  use_potential_crossing: true
  use_categorical_edge_types: true
  use_edge_labels_as_features: false
  use_continuous_edge_labels: true
  use_cut_edges: false

  use_constraint_vocab: false
  use_structural_degree: true
  use_structural_degree_nsew: false
  use_capacity: true
  use_unused_capacity: true
  use_conflict_status: true
  use_closeness_centrality: false
  use_articulation_points: false
  use_spectral_features: false

  use_verification_head: false
  verifier_use_puzzle_nodes: false
  verifier_use_row_col_meta_nodes: false
  use_noise_head: false
  aux_predict_output_noise: false

training:
  mode: "residual"
  recursive_carryover: false
  num_inference_steps_training: 3
  n_blocks: 2
  
  learning_rate: 0.001
  adam_epsilon: 1e-8
  batch_size: 4
  accumulation_steps: 1
  epochs: 2
  device: "cpu"
  num_workers: 0
  use_persistent_workers: false

  lr_scheduler: "none"
  lr_min: 1e-5

  ema_enabled: false
  ema_decay: 0.999

  sigma_max: 2.0
  scale_min: 4.0
  scale_max: 8.0
  alpha_power: 1.5
  zero_signal_prob: 0.75
  rollout_init: "noise"
  eval_rollout_interval: 1
  diffusion_max_steps: 10

  loss_weights:
    residual_mse: 1.0
    degree: 0.0
    crossing: 0.0
    verify: 0.0

  early_stopping:
    monitor: "val_perfect_acc"
    patience: 999
    min_delta: 0.0001

  bptt:
    enabled: false
    window: 10
    stride: 10
    loss_ema_decay: 0.9

  eval_interval: 1
